<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <title>Contact Form</title>
        <style>
            table {
                width: 500px;
                margin: 30px auto;
                border: 1px solid #aaa;
                border-collapse: collapse;
                padding: 15px;
            }
            td {
                padding: 8px;
            }
            h2 {
                margin: 0;
            }
            .line {
                border-bottom: 1px solid #ccc;
                height: 1px;
            }
            input,
            textarea {
                width: 100%;
                padding: 6px;
                box-sizing: border-box;
            }
            textarea {
                height: 100px;
            }
            .btn {
                background-color: #4fb3c8;
                color: white;
                border: none;
                padding: 10px;
                width: 100%;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <td><h2>Contact</h2></td>
            </tr>
            <tr>
                <td class="line"></td>
            </tr>

            <tr>
                <td>Title</td>
            </tr>
            <tr>
                <td><input type="text" placeholder="your title" /></td>
            </tr>

            <tr>
                <td>Email</td>
            </tr>
            <tr>
                <td><input type="email" placeholder="@gmail.com" /></td>
            </tr>

            <tr>
                <td>Content</td>
            </tr>
            <tr>
                <td><textarea></textarea></td>
            </tr>

            <tr>
                <td>
                    <button class="btn">Send</button>
                </td>
            </tr>
        </table>
    </body>
</html>
